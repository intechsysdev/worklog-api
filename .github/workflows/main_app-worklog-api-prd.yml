# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - app-worklog-api-prd

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build --configuration Release

      # Solo el API: publicar la solución deja varios runtimeconfig.json y App Service no sabe cuál arrancar.
      - name: dotnet publish
        run: dotnet publish src/WorkLog.Api/WorkLog.Api.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Package app
        run: zip -qr ${{ runner.temp }}/app.zip .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6FC7599D037148C5BF7018B7DDB227BF }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9ABA70A0D53240398533BE28165698AE }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B8226254C5414A3E804021E1B8A5C134 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-worklog-api-prd'
          slot-name: 'Production'
          package: ${{ runner.temp }}/app.zip
          type: zip
          # clean retira los runtimeconfig.json de pruebas que dejó el despliegue anterior.
          clean: true
          restart: true
